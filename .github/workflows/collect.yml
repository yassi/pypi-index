name: Collect download statistics

on:
  schedule:
    - cron: "23 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      # A failed package must not stop the others being published, so this fails the run at the end.
      - id: collect
        continue-on-error: true
        run: pypi-tracker collect

      - name: Commit and push any changes
        run: |
          git add data
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: collect download statistics for $(date -u +%F)"
          git push

      - name: Fail if any package failed to collect
        if: steps.collect.outcome == 'failure'
        run: exit 1
